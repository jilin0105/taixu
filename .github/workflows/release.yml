name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 从 Secrets 还原签名 keystore
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "storeFile=$(pwd)/release.jks" >> gradle.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> gradle.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> gradle.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> gradle.properties

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Identify and Rename Output APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            TAG="${{ github.ref_name }}"
            cp "$APK_PATH" "output/TaiXu-arm64-${TAG}.apk"
            sha256sum "output/TaiXu-arm64-${TAG}.apk" > "output/TaiXu-arm64-${TAG}.apk.sha256"
            echo "APK_FILE=output/TaiXu-arm64-${TAG}.apk" >> $GITHUB_ENV
            echo "SHA_FILE=output/TaiXu-arm64-${TAG}.apk.sha256" >> $GITHUB_ENV
            echo "TAG=$TAG" >> $GITHUB_ENV
          else
            echo "Error: No release APK generated!" && exit 1
          fi

      # 生成两个相邻版本标签之间的 git 提交日志作为 Release Notes
      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          # 找到上一个版本标签
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          echo "当前版本：$CURRENT_TAG，上一版本：$PREV_TAG"

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" "$CURRENT_TAG")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${CURRENT_TAG}")
          fi

          # 按 feat/fix/perf/refactor/chore 分组归类
          FEAT=$(echo "$LOG" | grep -i "^- feat" || true)
          FIX=$(echo "$LOG" | grep -i "^- fix" || true)
          PERF=$(echo "$LOG" | grep -i "^- perf\|^- refactor\|^- improve" || true)
          CHORE=$(echo "$LOG" | grep -Eiv "^- feat|^- fix|^- perf|^- refactor|^- improve" || true)

          {
            echo "## 太墟 $CURRENT_TAG 更新说明"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "> 本版本包含自 \`$PREV_TAG\` 起的全部变更"
            fi
            echo ""
            if [ -n "$FEAT" ]; then
              echo "### ✨ 新特性"
              echo "$FEAT"
              echo ""
            fi
            if [ -n "$FIX" ]; then
              echo "### 🐛 Bug 修复"
              echo "$FIX"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### ⚡ 性能与优化"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$CHORE" ]; then
              echo "### 🔧 其他变更"
              echo "$CHORE"
              echo ""
            fi
            echo "---"
            echo "**SHA-256 校验**"
            echo "\`\`\`"
            cat "${{ env.SHA_FILE }}"
            echo "\`\`\`"
          } > release_notes.md

          echo "RELEASE_NOTES_FILE=release_notes.md" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: output/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "太墟 ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
