name: Build TaiXuDev APK

# TaiXuDev 自定义迭代变体构建工作流
# 构建 dev build type APK（包名 top.wkbin.taixu.dev，应用名 TaiXuDev），与正式版独立共存。

on:
  workflow_dispatch:
    inputs:
      assemble_task:
        description: 'Gradle 构建任务（默认 assembleDev）'
        required: false
        default: 'assembleDev'
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'core/**'
      - 'feature/**'
      - 'runtime/**'
      - 'harness/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/taixudev-build.yml'

jobs:
  build-taixudev:
    name: Build TaiXuDev (dev variant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (NDK + CMake + platform)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;37.0.0
            ndk;30.0.15729638
            cmake;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: taixudev-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: taixudev-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build TaiXuDev APK
        run: ./gradlew ${{ github.event.inputs.assemble_task || 'assembleDev' }} --no-daemon --stacktrace

      - name: Upload TaiXuDev APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TaiXuDev-APK
          path: app/build/outputs/apk/dev/*.apk
          if-no-files-found: warn
