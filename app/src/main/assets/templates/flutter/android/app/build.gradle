plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "{{packageName}}"
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "{{packageName}}"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // NDK 只提供 linux-x86_64 的 llvm-strip，在 ARM64 PRoot 里无法启动。
    // 保留 native 调试符号，避免 AGP 调用它导致构建失败。
    packaging {
        jniLibs {
            keepDebugSymbols += "**/*.so"
        }
    }

    // Flutter 引擎走 prefab + CMake 原生构建；默认 CMake 3.22.1 只有 linux-x86_64
    // 二进制，在 ARM64 PRoot 里跑不起来。3.31.0 起提供 Linux-aarch64 二进制。
    externalNativeBuild {
        cmake {
            version "3.31.0"
        }
    }
}

flutter { source "../.." }
